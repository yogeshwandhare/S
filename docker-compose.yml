name: smartvision

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smartvision}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartvision}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Exposed on host only for local debugging (psql, a GUI client).
      # Remove this in a real production deployment.
      - "127.0.0.1:5433:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartvision}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-smartvision}
      SECRET_KEY: '${SECRET_KEY:?Set SECRET_KEY in .env -- generate with: python -c "import secrets; print(secrets.token_urlsafe(64))"}'
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ALLOW_DEV_BOOTSTRAP: ${ALLOW_DEV_BOOTSTRAP:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      INFERENCE_DEVICE: ${INFERENCE_DEVICE:-auto}
      HF_HOME: /models/clip
      USB_CAMERA_BRIDGE_URL: ${USB_CAMERA_BRIDGE_URL:-}
      EVIDENCE_STORAGE_DIR: /data/evidence
      SAMPLE_DATA_DIR: /data/sample_data
    volumes:
      - evidence_storage:/data/evidence
      - ./sample_data:/data/sample_data:ro
      - ./models/rfdetr:/root/.roboflow/models
      - ./models/weapons:/models/weapons:ro
      - ./models/clip:/models/clip
      - ./models/abandoned:/models/abandoned:ro
    ports:
      # Direct backend access for API docs / debugging. Caddy also proxies
      # /api/* on :8080 for the frontend's same-origin requests.
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
  evidence_storage:
