[project]
name = "smartvision-backend"
version = "0.1.0"
description = "SmartVision API: auth, cameras, zones, incidents, model registry, notifications."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.38,<0.39",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.19,<1.20",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3,<4.0",
    "python-multipart>=0.0.20",
    "email-validator>=2.2",
    "httpx>=0.28",
    "smartvision-vision-worker",
]

[project.optional-dependencies]
# The Apache-2.0 default object detector.
rfdetr = ["smartvision-vision-worker[rfdetr]"]
# The opt-in AGPL-3.0 detector adapter -- see docs/MODEL_REGISTRY.md and
# scripts/download_models.py before enabling this.
yolo = ["smartvision-vision-worker[yolo]"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's dependency-injection idiom is `param: T = Depends(...)` --
# a function call in a default argument is the intended pattern, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
smartvision-vision-worker = { path = "../vision_worker", editable = true }
